{% extends "base.html" %}
{% block title %}Sign Up — StrayRescue Meerut{% endblock %}

{% block content %}
<section style="padding: 4rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 fade-in-up">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div style="width: 64px; height: 64px; border-radius: 16px; background: var(--gradient-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                            <i class="bi bi-person-plus-fill" style="font-size: 1.6rem; color: #fff;"></i>
                        </div>
                        <h2 style="font-weight: 800; letter-spacing: -0.5px;">Create Account</h2>
                        <p style="color: var(--text-muted); font-size: 0.92rem;">Join the rescue community in Meerut.</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.signup') }}" id="signup-form">
                        <div class="mb-3">
                            <label class="form-label" for="signup-name">Full Name *</label>
                            <input type="text" class="form-control" id="signup-name" name="name" required placeholder="Your full name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="signup-email">Email *</label>
                            <input type="email" class="form-control" id="signup-email" name="email" required placeholder="you@example.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="signup-phone">Phone</label>
                            <input type="tel" class="form-control" id="signup-phone" name="phone" placeholder="+91 XXXXX XXXXX">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="signup-role">I want to join as</label>
                            <select class="form-select" id="signup-role" name="role">
                                <option value="public">Public User — Report sightings</option>
                                <option value="volunteer">Volunteer — Claim & rescue animals</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="signup-password">Password *</label>
                            <input type="password" class="form-control" id="signup-password" name="password" required minlength="6" placeholder="Minimum 6 characters">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="signup-confirm">Confirm Password *</label>
                            <input type="password" class="form-control" id="signup-confirm" name="confirm_password" required placeholder="Re-enter password">
                        </div>

                        <button type="submit" class="btn btn-primary-gradient w-100 py-2" id="signup-submit">
                            <i class="bi bi-person-plus"></i> Create Account
                        </button>
                    </form>

                    <p class="text-center mt-3 mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}" style="color: var(--accent-purple); font-weight: 600; text-decoration: none;">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
